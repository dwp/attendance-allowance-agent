{% extends "version-2/layouts/internal-layout.html" %}

{% set pageName = "Enter the name DWP should use for the claimant" %}

{% block content %}
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-full">

      <form action="requested-name-start-date" method="post" novalidate>
        <div class="govuk-form-group">
          <fieldset class="govuk-fieldset">
            <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
              <h1 class="govuk-fieldset__heading">
                {{ pageName }}
              </h1>
            </legend>
            <div id="claimNameStartDate-hint" class="govuk-hint">
              This is sometimes called the requested name.
            </div>
            <input class="govuk-input govuk-input--width-20" id="claimRequestedName" name="claimRequestedName" type="text" value="{{data['claimRequestedName']}}"/>
          </fieldset>
        </div>
        <button type="submit" class="govuk-button" data-module="govuk-button">
          Save and continue
        </button>
      </form>
    </div>
  </div>

{% endblock %}
